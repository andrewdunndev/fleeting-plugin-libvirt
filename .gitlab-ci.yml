default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages:
  - lint
  - test
  - build
  - release
  - publish

variables:
  GOFLAGS: -mod=readonly

include:
  - component: gitlab.com/dunn.dev/pipeline/go-lint@4.13.0
  - component: gitlab.com/dunn.dev/pipeline/go-audit@4.13.0
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4.13.0
    inputs:
      reference_ref: main
      fail_on_violation: true
  - component: gitlab.com/dunn.dev/pipeline/go-build@4.13.0
    inputs:
      job_name: go-build
      binary_name: fleeting-plugin-libvirt
      package_path: ./cmd/fleeting-plugin-libvirt
  - component: gitlab.com/dunn.dev/pipeline/release-create@4.13.0
    inputs:
      stage: publish
      package_name: fleeting-plugin-libvirt
      binary_job: release-oci

# The catalog's lint and audit carry no rules of their own, so the
# workflow guard above would otherwise skip them on MR pipelines.
lint:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

audit:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'

test:
  stage: test
  image: registry.gitlab.com/dunn.dev/pipeline/ci-go:4.13.0
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    GOCACHE: $CI_PROJECT_DIR/.gocache
  cache:
    key:
      files: [go.sum]
      prefix: test
    paths:
      - .gomodcache/
      - .gocache/
  script:
    - go vet ./...
    - go test -race -timeout 2m ./...

# Pushes the plugin as a fleeting-artifact OCI image to this project's
# container registry, which must be enabled.
release-oci:
  stage: release
  image: registry.gitlab.com/dunn.dev/pipeline/ci-go:4.13.0
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GOFLAGS: ""
    CGO_ENABLED: "0"
    COSIGN_YES: "true"
    FLEETING_ARTIFACT: gitlab.com/gitlab-org/fleeting/fleeting-artifact/cmd/fleeting-artifact@v0.0.0-20260911011821-1b7c6957ad1d
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - |
      for arch in amd64 arm64; do
        GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/linux/$arch/plugin ./cmd/fleeting-plugin-libvirt
      done
    - go install "$FLEETING_ARTIFACT"
    - FA="$(go env GOPATH)/bin/fleeting-artifact"
    - $FA login -username "$CI_REGISTRY_USER" -password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - IMAGE_DIGEST="$($FA release -dir dist "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}")"
    - cosign sign "$IMAGE_DIGEST"
